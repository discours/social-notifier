name: Ошибка
description: Посты не приходят, приходят дважды или алерт непонятен
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не вставляйте сюда токены, ID чатов и содержимое секретов. Логи запусков публичные, поэтому ссылки на них достаточно.
        Уязвимость — не сюда, а приватно: [SECURITY.md](https://github.com/discours/social-notifier/blob/main/SECURITY.md).
  - type: dropdown
    id: network
    attributes:
      label: Сеть
      options: [VK, Instagram, Facebook, Bluesky, YouTube, X, RSS или Atom, Telegram, другое]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что ждали и что произошло. Если пришёл алерт — его текст без ссылок на чаты.
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Ссылка на запуск
      description: Actions → radar или probe → нужный запуск.
  - type: textarea
    id: probe
    attributes:
      label: Вывод пробы
      description: Строки из лога пробы (Actions → probe) для этой сети.
      render: text
