name: Bug
description: Posts do not arrive, arrive twice, or an alert is unclear
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, chat IDs, or the contents of secrets here. Run logs are public, so a link to the run is enough. You can write in English or Russian.
        A vulnerability does not go here; report it privately: [SECURITY.md](https://github.com/discours/social-notifier/blob/main/SECURITY.md).
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [VK, Instagram, Facebook, Bluesky, YouTube, X, RSS or Atom, Telegram, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened. If an alert arrived, its text without links to chats. English or Russian is fine.
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Link to the run
      description: Actions → radar or probe → the run in question.
  - type: textarea
    id: probe
    attributes:
      label: Probe output
      description: Lines from the probe log (Actions → probe) for this network.
      render: text
