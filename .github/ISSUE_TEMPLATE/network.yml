name: New network
description: Suggest a network worth reading posts from
labels: [network]
body:
  - type: markdown
    attributes:
      value: |
        First check the [list of networks that are not supported yet](https://github.com/discours/social-notifier/blob/main/docs/sources/unsupported.md): it already explains what blocks TikTok, Threads, and Telegram channels. You can write in English or Russian.
  - type: input
    id: network
    attributes:
      label: Network
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Official API
      description: A link to the documentation of the method that returns an account's posts. Whether it needs a key or a sign-in, and what it costs.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Which account you want to read and who will get the notifications.
