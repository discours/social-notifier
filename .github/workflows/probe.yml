name: probe

# Ручная проверка доступов: читает каждый источник, показывает, какие страницы
# и Instagram-аккаунты видит токен Meta, и проверяет бота Telegram.
# Состояние не трогает. С send_test шлёт в чат алертов тестовое сообщение с
# образцом уведомления. С find_chats только ищет чаты: бот отвечает в каждый
# чат из своих обновлений за сутки сообщением с ID этого чата, кроме чатов,
# уже записанных в секреты; в лог ID не пишутся.

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test message with a sample notification to the alerts chat'
        type: boolean
        default: false
      find_chats:
        description: 'Find chat IDs: the bot replies with the ID in every chat it heard from in the last 24 hours, except chats already saved in secrets'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Probe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SEND_TEST: ${{ inputs.send_test }}
          FIND_CHATS: ${{ inputs.find_chats }}
          RADAR_CONFIG: ${{ vars.RADAR_CONFIG || 'radar.config.json' }}
        run: |
          args=(--config "$RADAR_CONFIG")
          if [ "$SEND_TEST" = "true" ]; then args+=(--send-test); fi
          if [ "$FIND_CHATS" = "true" ]; then args+=(--find-chats); fi
          node src/probe.ts "${args[@]}"
