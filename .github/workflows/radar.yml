name: radar

# Раз в 10 минут проверяет источники и отправляет новые посты в Telegram.
# Расписание включается переменной репозитория RADAR_ENABLED=true; ручной
# запуск работает всегда. Состояние (виденные посты, очередь, счётчики сбоев)
# хранится в ветке `state`, чтобы не засорять историю main.

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show in the log what would be sent, without saving state'
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write # запись в ветку state
  actions: write # продление расписания, см. шаг «Keep the schedule awake»

jobs:
  radar:
    if: github.event_name == 'workflow_dispatch' || vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    # С запасом: если задачу убьют до сохранения состояния, отправленные посты
    # придут повторно.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Attach the state branch
        run: |
          # Код 2 — ветки нет (первый запуск); любой другой ненулевой — сбой сети
          # или доступа, и тогда новую ветку создавать нельзя. Имя — полное:
          # короткое `state` ls-remote сопоставляет по хвосту и находит, например,
          # `dobrodob/state`.
          set +e
          git ls-remote --exit-code origin refs/heads/state >/dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --quiet --depth=1 origin refs/heads/state
            git worktree add --quiet --detach state-store FETCH_HEAD
            # Ветка есть, а файла нет — кто-то её почистил. Пустое состояние
            # здесь потеряло бы очередь, поэтому стоп, а не первый запуск.
            if [ ! -f state-store/state.json ]; then
              echo "::error::the state branch has no state.json; restore it or delete the whole branch"
              exit 1
            fi
          elif [ "$code" -eq 2 ]; then
            echo "no state branch yet, the first run will create it"
            git worktree add --quiet --orphan -b state state-store
          else
            echo "::error::could not check the state branch (git ls-remote, exit code $code)"
            exit 1
          fi

      - name: Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Форк держит свой конфиг в своём файле: тогда обновления через
          # Sync fork не конфликтуют с конфигом оригинала.
          RADAR_CONFIG: ${{ vars.RADAR_CONFIG || 'radar.config.json' }}
        run: node src/main.ts --config "$RADAR_CONFIG" --state state-store/state.json

      # always(): красный запуск (алерт) тоже меняет состояние — отметку алерта
      # и счётчики сбоев, их надо сохранить.
      - name: Save state
        if: always() && !inputs.dry_run
        working-directory: state-store
        run: |
          if [ ! -f state.json ]; then
            echo "state.json was not created, nothing to save"
            exit 0
          fi
          git add state.json
          if git diff --cached --quiet; then
            echo "state has not changed"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --quiet origin HEAD:refs/heads/state

      # GitHub выключает расписание публичного репозитория после 60 дней без
      # «активности репозитория»; что именно считается активностью, GitHub не
      # уточняет. Две страховки без гарантии: коммиты в ветку state (при новых
      # постах и раз в 25 дней) и повторное включение workflow через API.
      # Сбой шага не красит запуск, но виден в логе.
      - name: Keep the schedule awake
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable"
