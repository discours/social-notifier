<svg xmlns="http://www.w3.org/2000/svg" width="980" height="444" viewBox="0 0 980 444" role="img" aria-labelledby="title desc">
  <title id="title">Сообщения social-notifier в Telegram</title>
  <desc id="desc">Слева чат постов: одно сообщение со ссылками на новые посты VK, Instagram, блога, YouTube и Telegram-канала. Справа чат алертов: Instagram не читается 20 минут — что сделать и причина, затем сообщение, что посты снова читаются.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #000; }
    .caption { font-size: 13px; font-weight: 600; fill: #5b6b7a; letter-spacing: 0.04em; }
    .bot { font-weight: 600; fill: #2f8fd8; }
    .time { font-size: 11px; fill: #8fa0ae; }
    .b { font-weight: 700; }
    .a { fill: #2481cc; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #c03d6d; }
  </style>
  <rect width="980" height="444" rx="18" fill="#dbe5ec"/>

  <!-- Чат постов -->
  <text class="caption" x="30" y="38">ЧАТ ПОСТОВ</text>
  <rect x="30" y="54" width="440" height="258" rx="14" fill="#ffffff"/>
  <text class="bot" x="46" y="80">Бот редакции</text>
  <text x="46" y="106">Новые посты Дискурса, поддержим лайком и репостом:</text>
  <text x="46" y="146"><tspan class="b">VK</tspan>: <tspan class="a">Дом — это люди</tspan></text>
  <text x="46" y="168"><tspan class="b">Instagram</tspan>: <tspan class="a">Пятеро детей — не повод отказываться</tspan></text>
  <text x="46" y="190"><tspan class="a">от себя</tspan></text>
  <text x="46" y="212"><tspan class="b">Блог</tspan>: <tspan class="a">Кто хранит архив города</tspan></text>
  <text x="46" y="234"><tspan class="b">YouTube</tspan>: <tspan class="a">Выпуск 12: почему мы до сих пор</tspan></text>
  <text x="46" y="256"><tspan class="a">читаем письма</tspan></text>
  <text x="46" y="278"><tspan class="b">Telegram</tspan>: <tspan class="a">Что мы читали на этой неделе</tspan></text>
  <text class="time" x="424" y="302">12:04</text>

  <!-- Чат алертов -->
  <text class="caption" x="510" y="38">ЧАТ АЛЕРТОВ</text>
  <rect x="510" y="54" width="440" height="280" rx="14" fill="#ffffff"/>
  <text class="bot" x="526" y="80">Бот редакции</text>
  <text x="526" y="106"><tspan class="b">Instagram</tspan>: посты не читаются, уже 20 мин.</text>
  <text x="526" y="128">Что сделать: выпустите новый токен и обновите</text>
  <text x="526" y="150">секрет META_TOKEN в настройках репозитория</text>
  <text x="526" y="172">(Settings → Secrets and variables → Actions).</text>
  <text x="526" y="194">Посты, вышедшие за это время, придут после</text>
  <text x="526" y="216">починки — из последних 25 и не старше 48 ч.</text>
  <text x="526" y="238">Причина: <tspan class="code">auth</tspan> — Graph API 190/463: Error</text>
  <text x="526" y="260">validating access token: Session has expired</text>
  <text x="526" y="282"><tspan class="a">Лог запуска</tspan></text>
  <text class="time" x="904" y="322">12:20</text>

  <rect x="510" y="346" width="440" height="78" rx="14" fill="#ffffff"/>
  <text class="bot" x="526" y="372">Бот редакции</text>
  <text x="526" y="398"><tspan class="b">Instagram</tspan>: посты снова читаются.</text>
  <text class="time" x="904" y="414">13:05</text>
</svg>
